name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 安装依赖
        run: npm ci

      # 关键一步：校验黄金值 fixture 与安卓版完全一致。
      # 只要有人改动内核而没有同步 fixture，这里就会红 —— 这是
      # 「安卓和 iPhone 算出来一模一样」的强制保障。
      - name: 校验黄金值 fixture 未被意外改动
        run: |
          cd docs/reference
          sha256sum -c golden-values.sha256 2>/dev/null || shasum -a 256 -c golden-values.sha256
          echo "fixture 与安卓版共享，哈希一致说明两端行为契约未分叉。"

      - name: 类型检查
        run: npm run typecheck

      - name: 单元测试（含原网页逐位比对）
        run: npm test

      - name: 构建
        run: npm run build

      # 注意：这里**不能**加 enablement: true。
      # GITHUB_TOKEN 没有创建 Pages 站点的权限，加了会以
      # "Resource not accessible by integration" 直接失败（已实测踩过）。
      # Pages 需要仓库管理员在 Settings → Pages 里开启一次，
      # 或者由有 admin 权限的 token 调 POST /repos/{owner}/{repo}/pages 开启。
      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
